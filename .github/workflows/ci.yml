name: CI Checks

on:
  merge_group:
  pull_request:
    types: [opened, auto_merge_enabled, unlocked, synchronize]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  packages: read
  contents: read

jobs:
  unit_tests:
    runs-on: ubuntu-latest-4-cores
    name: Build and test packages
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        shell: bash
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: nix develop --command bun install --frozen-lockfile
      - name: Configure dotenv
        shell: bash
        run: cp .env.example .env
      - name: Run build
        run: nix develop --command bun run build
      - name: Run tests
        run: nix develop --command bun test
      - name: Docker build
        run: nix develop --command docker compose build
